plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nam'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
    commonsTextVersion = '1.14.0'
    dotenvJavaVersion = '3.2.0'
    lombokVersion = '1.18.38'
    modelMapperVersion = '3.1.1'
    springDocVersion = '2.8.9'
    jakartaMailVersion = '2.0.2'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation("org.apache.commons:commons-text:${commonsTextVersion}") {
        exclude group: 'org.apache.commons', module: 'commons-lang3'
    }
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation("io.github.cdimascio:dotenv-java:${dotenvJavaVersion}")
    implementation("org.projectlombok:lombok:${lombokVersion}")
    implementation("org.modelmapper:modelmapper:${modelMapperVersion}")
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}")
    implementation("com.sun.mail:jakarta.mail:${jakartaMailVersion}")
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly("io.jsonwebtoken:jjwt-impl:${jjwtVersion}")
    runtimeOnly("io.jsonwebtoken:jjwt-jackson:${jjwtVersion}")

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    annotationProcessor("org.projectlombok:lombok:${lombokVersion}")
}

tasks.named('test') {
    useJUnitPlatform()
}
